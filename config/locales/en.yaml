REC_PAIN_INTEGRATION: "Integration pain points are present. Redesign critical interfaces toward API/Event-driven patterns and reduce batch dependency."
REC_PAIN_AI_DATA: "AI or data enablement pain points are present. Define data quality, semantic model, and BTP extension standards together with Clean Core governance."
REC_PAIN_SECURITY: "Security or access pain points are present. Lock down role design, SoD review, and audit traceability early in the transformation roadmap."
REC_DEFAULT_BASELINE: "Conduct Fit-to-Standard checks for core modules first and plan to retain only essential custom code."
REC_LOW_RISK_GOVERNANCE: "To sustain maturity, run quarterly Fit-to-Standard governance reviews to control net-new customizations."
REC_LOW_RISK_KPI_MONITORING: "Monitor Clean Core KPIs monthly (new Z-code count, custom ratio, deployment failure rate) and trigger corrective action on threshold breach."
REC_LOW_RISK_ROADMAP: "Document a 12-month improvement roadmap (process standardization, BTP extension principles, technical debt cap) as an execution baseline."

