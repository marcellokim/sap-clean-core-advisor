REC_SCORE_LT_30: "Clean Core 점수가 매우 낮습니다. 커스텀 코드 대규모 정리를 최우선으로 추진하세요."
REC_SCORE_LT_60: "Clean Core 개선 여지가 큽니다. 사용하지 않는 Z-code 폐기부터 시작하세요."
REC_BS7_MAINSTREAM_END_2027: "현재 {erp_version}은 Business Suite 7 메인스트림 유지보수 종료(2027-12-31)에 해당합니다. RISE with SAP 기반 S/4HANA 전환 계획을 수립하세요."
INFO_BS7_EXTENDED_MAINT_AVAILABLE_2030: "Extended Maintenance 옵션(2030-12-31)도 존재하지만, 비용/가치 관점에서 임시 완충책으로만 검토하세요."
REC_DB_TO_HANA: "SAP HANA로의 DB 마이그레이션을 전환 계획에 포함하세요. 인메모리 처리로 분석 성능이 10-100배 향상됩니다."
REC_CUSTOM_RATIO_OVER_40: "커스텀 코드 비중이 높습니다. SAP Custom Code Migration Worklist로 Retire/Replace/Refactor 대상을 분류하세요."
REC_TCO_SAVINGS_POSITIVE: "Clean Core 전환 시 3년간 약 {tco_savings_3yr}억원 절감이 예상됩니다. 경영진 보고에 이 수치를 활용하세요."
REC_BUDGET_RATIO_OVER_100: "현재 운영 TCO가 연간 IT 예산을 초과합니다. 고비용 모듈 우선 정리와 단계적 전환으로 비용 급증 리스크를 제어하세요."
REC_BUDGET_RATIO_OVER_70: "현재 운영 TCO가 연간 IT 예산의 70% 이상입니다. 비핵심 커스텀 정리와 인프라 최적화 과제를 우선 실행하세요."
REC_HIGH_CUSTOM_MODULE_BTP: "{high_custom_modules} 모듈의 핵심 커스텀은 SAP BTP Side-by-Side Extension으로 재구축을 검토하세요."
REC_TIMELINE_TIGHT_PHASED: "모듈 수 대비 전환 기간이 촉박합니다. FI/CO 우선 전환 후 나머지를 단계적으로 진행하는 Phased Approach를 권고합니다."
REC_DEFAULT_BASELINE: "핵심 모듈별로 표준 프로세스 적합성(Fit-to-Standard)을 먼저 점검하고 필수 커스텀만 남기는 정리 계획을 수립하세요."
REC_LOW_RISK_GOVERNANCE: "현재 성숙도를 유지하려면 분기별 Fit-to-Standard 거버넌스 회의를 운영해 신규 커스텀 유입을 통제하세요."
REC_LOW_RISK_KPI_MONITORING: "Clean Core KPI(신규 Z코드 수, 커스텀 비중, 배포 실패율)를 월 단위로 모니터링하고 임계치 초과 시 즉시 조치하세요."
REC_LOW_RISK_ROADMAP: "향후 12개월 개선 로드맵(프로세스 표준화, BTP 확장 원칙, 기술부채 상한)을 문서화해 팀 간 실행 기준으로 사용하세요."

