name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run report QA gate
        run: make qa-report

      - name: Run safe-lane promotion gate
        run: make verify-safe-lane-promotion

      - name: Run safe-lane promotion strict gate (when telemetry log is provisioned)
        if: ${{ hashFiles('artifacts/telemetry/compat_usage.jsonl') != '' }}
        run: make verify-safe-lane-promotion-strict

      - name: Skip strict safe-lane promotion gate (telemetry log missing)
        if: ${{ hashFiles('artifacts/telemetry/compat_usage.jsonl') == '' }}
        run: echo "::notice::Skipping verify-safe-lane-promotion-strict (no telemetry log artifact in CI workspace)."
