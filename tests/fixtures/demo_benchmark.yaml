schema_version: 1
benchmark_id: demo_benchmark_v1
description: Deterministic benchmark fixture for benchmark-driven clean-core calibration.
  Covers manufacturing, retail, finance, base fallback, and four edge scenarios.
metadata:
  tuning_expectations:
    closest_score_pairs:
    - left_case_id: retail_low_risk_promo
      right_case_id: mfg_s4_stable
      minimum_gap: 0.2
      rationale: Keep the healthy manufacturing S/4 baseline slightly above the retail
        promo baseline.
    - left_case_id: mfg_high_custom_factory
      right_case_id: extreme_high_custom_ratio
      minimum_gap: 0.5
      rationale: Preserve visible separation between heavy factory customization pressure
        and the pure custom-ratio edge case.
    - left_case_id: extreme_multi_axis_pain
      right_case_id: extreme_short_timeline
      minimum_gap: 0.8
      rationale: Keep the six-axis pain fallback case distinct from the short-timeline
        finance stress case.
cases:
